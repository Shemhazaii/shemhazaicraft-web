apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2
            - run
            - --url
            - http://ingress-nginx-controller.ingress-nginx.svc.cluster.local:80
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token